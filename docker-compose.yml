services:
  user-db:
    image: mysql:5.7
    container_name: enterprise-user-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3307:3306"
    volumes:
      - user-db-data:/var/lib/mysql
      - ./database/user-db/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  user-service:
    image: enterprise-user-service
    container_name: enterprise-user-service
    ports:
      - "8080:8080"
    depends_on:
      - user-db
volumes:
  user-db-data: